<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url(concole.png);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Arial', sans-serif;
            
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #ff6b6b, #ffd93d, #6bcf7f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 40px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
        }

        .score {
            text-align: center;
        }

        .score h3 {
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #ddd;
        }

        .score-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .game-area {
            margin: 40px 0;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .choice {
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid transparent;
            border-radius: 20px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
            position: relative;
            overflow: hidden;
        }

        .choice:hover {
            transform: translateY(-5px) scale(1.05);
            border-color: #fff;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .choice:active {
            transform: translateY(-2px) scale(1.02);
        }

        .choice-emoji {
            font-size: 3em;
            margin-bottom: 10px;
            display: block;
        }

        .choice-text {
            font-size: 1.1em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .battle-area {
            margin: 40px 0;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .battle-display {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }

        .player-choice, .computer-choice {
            text-align: center;
            flex: 1;
        }

        .choice-label {
            font-size: 1.2em;
            margin-bottom: 15px;
            font-weight: bold;
            color: #ddd;
        }

        .battle-emoji {
            font-size: 4em;
            margin-bottom: 10px;
            display: block;
            animation: bounce 0.5s ease-in-out;
        }

        .vs-text {
            font-size: 2em;
            font-weight: bold;
            color: #ff6b6b;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin: 0 20px;
        }

        .result {
            font-size: 1.5em;
            font-weight: bold;
            margin: 20px 0;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .win {
            color: #4CAF50;
            animation: pulse 1s infinite;
        }

        .lose {
            color: #ff6b6b;
            animation: shake 0.5s;
        }

        .tie {
            color: #ffd93d;
            animation: flash 1s;
        }

        .reset-btn {
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 20px;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }

        .round-info {
            font-size: 1.1em;
            margin: 20px 0;
            color: #ddd;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-5px);
            }
            75% {
                transform: translateX(5px);
            }
        }

        @keyframes flash {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 15px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #4CAF50;
        }

        .stat-label {
            font-size: 0.9em;
            color: #ddd;
        }

        @media (max-width: 768px) {
            .game-container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .choices {
                gap: 10px;
            }
            
            .choice {
                min-width: 100px;
                padding: 15px;
            }
            
            .choice-emoji {
                font-size: 2.5em;
            }
            
            .battle-display {
                flex-direction: column;
                gap: 20px;
            }
            
            .vs-text {
                order: 2;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎯 Rock Paper Scissors 🎯</h1>
        
        <div class="scoreboard">
            <div class="score">
                <h3>You</h3>
                <div class="score-number" id="playerScore">0</div>
            </div>
            <div class="score">
                <h3>Computer</h3>
                <div class="score-number" id="computerScore">0</div>
            </div>
        </div>

        <div class="round-info">
            <span id="roundInfo">Choose your weapon!</span>
        </div>

        <div class="game-area">
            <div class="choices">
                <div class="choice" data-choice="rock">
                    <span class="choice-emoji">🪨</span>
                    <div class="choice-text">Rock</div>
                </div>
                <div class="choice" data-choice="paper">
                    <span class="choice-emoji">📄</span>
                    <div class="choice-text">Paper</div>
                </div>
                <div class="choice" data-choice="scissors">
                    <span class="choice-emoji">✂️</span>
                    <div class="choice-text">Scissors</div>
                </div>
            </div>

            <div class="battle-area">
                <div class="battle-display" id="battleDisplay" style="display: none;">
                    <div class="player-choice">
                        <div class="choice-label">You</div>
                        <span class="battle-emoji" id="playerEmoji">❓</span>
                    </div>
                    <div class="vs-text">VS</div>
                    <div class="computer-choice">
                        <div class="choice-label">Computer</div>
                        <span class="battle-emoji" id="computerEmoji">❓</span>
                    </div>
                </div>
                
                <div class="result" id="result"></div>
            </div>
        </div>

        <div class="game-stats">
            <div class="stat">
                <div class="stat-number" id="totalGames">0</div>
                <div class="stat-label">Games</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="winPercentage">0%</div>
                <div class="stat-label">Win Rate</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="currentStreak">0</div>
                <div class="stat-label">Streak</div>
            </div>
        </div>

        <button class="reset-btn" id="resetBtn">Reset Game</button>
    </div>

    <script>
        class RockPaperScissors {
            constructor() {
                this.playerScore = 0;
                this.computerScore = 0;
                this.totalGames = 0;
                this.currentStreak = 0;
                this.isStreakWin = true;
                
                this.choices = ['rock', 'paper', 'scissors'];
                this.emojis = {
                    rock: '🪨',
                    paper: '📄',
                    scissors: '✂️'
                };
                
                this.initializeElements();
                this.setupEventListeners();
            }
            
            initializeElements() {
                this.playerScoreEl = document.getElementById('playerScore');
                this.computerScoreEl = document.getElementById('computerScore');
                this.roundInfoEl = document.getElementById('roundInfo');
                this.battleDisplayEl = document.getElementById('battleDisplay');
                this.playerEmojiEl = document.getElementById('playerEmoji');
                this.computerEmojiEl = document.getElementById('computerEmoji');
                this.resultEl = document.getElementById('result');
                this.totalGamesEl = document.getElementById('totalGames');
                this.winPercentageEl = document.getElementById('winPercentage');
                this.currentStreakEl = document.getElementById('currentStreak');
                this.resetBtnEl = document.getElementById('resetBtn');
                this.choiceElements = document.querySelectorAll('.choice');
            }
            
            setupEventListeners() {
                this.choiceElements.forEach(choice => {
                    choice.addEventListener('click', () => {
                        const playerChoice = choice.dataset.choice;
                        this.playRound(playerChoice);
                    });
                });
                
                this.resetBtnEl.addEventListener('click', () => {
                    this.resetGame();
                });
            }
            
            playRound(playerChoice) {
                const computerChoice = this.getComputerChoice();
                const result = this.determineWinner(playerChoice, computerChoice);
                
                this.displayBattle(playerChoice, computerChoice);
                this.updateScores(result);
                this.updateStats();
                this.displayResult(result);
                
                this.totalGames++;
            }
            
            getComputerChoice() {
                const randomIndex = Math.floor(Math.random() * this.choices.length);
                return this.choices[randomIndex];
            }
            
            determineWinner(playerChoice, computerChoice) {
                if (playerChoice === computerChoice) {
                    return 'tie';
                }
                
                if (
                    (playerChoice === 'rock' && computerChoice === 'scissors') ||
                    (playerChoice === 'paper' && computerChoice === 'rock') ||
                    (playerChoice === 'scissors' && computerChoice === 'paper')
                ) {
                    return 'win';
                }
                
                return 'lose';
            }
            
            displayBattle(playerChoice, computerChoice) {
                this.battleDisplayEl.style.display = 'flex';
                this.playerEmojiEl.textContent = this.emojis[playerChoice];
                this.computerEmojiEl.textContent = this.emojis[computerChoice];
                
                // Add animation
                this.playerEmojiEl.style.animation = 'none';
                this.computerEmojiEl.style.animation = 'none';
                
                setTimeout(() => {
                    this.playerEmojiEl.style.animation = 'bounce 0.5s ease-in-out';
                    this.computerEmojiEl.style.animation = 'bounce 0.5s ease-in-out';
                }, 10);
            }
            
            updateScores(result) {
                if (result === 'win') {
                    this.playerScore++;
                } else if (result === 'lose') {
                    this.computerScore++;
                }
                
                this.playerScoreEl.textContent = this.playerScore;
                this.computerScoreEl.textContent = this.computerScore;
            }
            
            updateStats() {
                this.totalGamesEl.textContent = this.totalGames + 1;
                
                if (this.totalGames > 0) {
                    const winPercentage = Math.round((this.playerScore / (this.totalGames + 1)) * 100);
                    this.winPercentageEl.textContent = `${winPercentage}%`;
                }
            }
            
            displayResult(result) {
                this.resultEl.className = 'result';
                
                if (result === 'win') {
                    this.resultEl.textContent = '🎉 You Win! 🎉';
                    this.resultEl.classList.add('win');
                    this.roundInfoEl.textContent = 'Great job! Choose again to continue.';
                    this.updateStreak(true);
                } else if (result === 'lose') {
                    this.resultEl.textContent = '😞 You Lose! 😞';
                    this.resultEl.classList.add('lose');
                    this.roundInfoEl.textContent = 'Better luck next time! Try again.';
                    this.updateStreak(false);
                } else {
                    this.resultEl.textContent = '🤝 It\'s a Tie! 🤝';
                    this.resultEl.classList.add('tie');
                    this.roundInfoEl.textContent = 'Great minds think alike! Go again.';
                    // Tie doesn't break streak
                }
            }
            
            updateStreak(isWin) {
                if (isWin) {
                    if (this.isStreakWin) {
                        this.currentStreak++;
                    } else {
                        this.currentStreak = 1;
                        this.isStreakWin = true;
                    }
                } else {
                    if (!this.isStreakWin) {
                        this.currentStreak++;
                    } else {
                        this.currentStreak = 1;
                        this.isStreakWin = false;
                    }
                }
                
                this.currentStreakEl.textContent = this.currentStreak;
            }
            
            resetGame() {
                this.playerScore = 0;
                this.computerScore = 0;
                this.totalGames = 0;
                this.currentStreak = 0;
                this.isStreakWin = true;
                
                this.playerScoreEl.textContent = '0';
                this.computerScoreEl.textContent = '0';
                this.totalGamesEl.textContent = '0';
                this.winPercentageEl.textContent = '0%';
                this.currentStreakEl.textContent = '0';
                
                this.battleDisplayEl.style.display = 'none';
                this.resultEl.textContent = '';
                this.resultEl.className = 'result';
                this.roundInfoEl.textContent = 'Choose your weapon!';
            }
        }
        
        // Initialize the game when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new RockPaperScissors();
        });
    </script>
    <a href="index.html"><button>Back</button></a>
</body>
</html>
